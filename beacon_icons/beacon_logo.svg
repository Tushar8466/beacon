<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- light beam sweeping left -->
  <polygon points="70,40 8,20 8,34" fill="url(#beam)"/>
  <!-- light beam sweeping right -->
  <polygon points="58,40 120,20 120,34" fill="url(#beam)"/>

  <!-- lighthouse base -->
  <polygon points="50,112 78,112 72,96 56,96" fill="#f8fafc"/>
  <!-- lighthouse body -->
  <polygon points="54,96 74,96 68,46 60,46" fill="#f8fafc"/>
  <!-- stripe band -->
  <rect x="58" y="62" width="12" height="8" fill="#3b82f6"/>
  <!-- lantern room -->
  <rect x="57" y="34" width="14" height="14" rx="2" fill="#fde68a" stroke="#f8fafc" stroke-width="2"/>
  <!-- roof -->
  <polygon points="64,20 74,34 54,34" fill="#f8fafc"/>
  <!-- top finial -->
  <rect x="62.5" y="14" width="3" height="8" fill="#f8fafc"/>
</svg>
