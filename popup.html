<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF2GitHub Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
        </div>
        <div>
          <h1 class="title">CF2GitHub</h1>
          <p class="subtitle">Codeforces to GitHub Auto-Sync</p>
        </div>
      </div>
      <span class="version-badge">v1.0</span>
    </header>

    <!-- Main Content Form -->
    <main class="content">
      <div id="status-alert" class="alert hidden">
        <span id="alert-icon" class="alert-icon"></span>
        <span id="alert-message" class="alert-message"></span>
      </div>

      <form id="settings-form" autocomplete="off">
        <!-- GitHub Token -->
        <div class="form-group">
          <label for="githubToken" class="form-label">
            <span>GitHub Personal Access Token</span>
            <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input type="password" id="githubToken" placeholder="ghp_... or github_pat_..." required />
            <button type="button" id="toggle-token-btn" class="icon-btn" title="Toggle Visibility">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="form-hint">Token needs <code>repo</code> or <code>Contents: Read & Write</code> permission.</span>
        </div>

        <!-- Owner & Repo Grid -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="repoOwner" class="form-label">
              <span>Repo Owner</span>
              <span class="required">*</span>
            </label>
            <input type="text" id="repoOwner" placeholder="e.g. Tushar8466" required />
            <span class="form-hint">GitHub handle (not display name)</span>
          </div>

          <div class="form-group flex-1">
            <label for="repoName" class="form-label">
              <span>Repo Name</span>
              <span class="required">*</span>
            </label>
            <input type="text" id="repoName" placeholder="e.g. Competitive-Programming" required />
          </div>
        </div>

        <!-- Branch & Folder Prefix Grid -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="branch" class="form-label">Branch</label>
            <input type="text" id="branch" placeholder="main" value="main" />
          </div>

          <div class="form-group flex-1">
            <label for="folderPrefix" class="form-label">Folder Prefix</label>
            <input type="text" id="folderPrefix" placeholder="Codeforces" value="Codeforces" />
          </div>
        </div>

        <!-- Auto Push Switch Box -->
        <div class="toggle-card">
          <div class="toggle-info">
            <span class="toggle-title">Auto-Push Accepted Solutions</span>
            <span class="toggle-desc">Automatically pushes solutions submitted in the last ~15 mins</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoPush" checked />
            <span class="slider"></span>
          </label>
        </div>

        <!-- Actions -->
        <div class="actions-row">
          <button type="button" id="test-btn" class="btn btn-secondary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span>Test Connection</span>
          </button>
          
          <button type="submit" id="save-btn" class="btn btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Save Settings</span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
